<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reviews — Vertted Client</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #fafaf9; color: #1a1a24; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; background: none; }

    :root {
      --primary: #1e2b4f; --primary-dark: #151d36;
      --accent: #f26b21; --accent-hover: #d95b17; --accent-soft: #fdf2e8;
      --text-main: #1a1a24; --text-muted: #5e5e6b;
      --border-color: #e5e3df; --white: #fff;
      --shadow-sm: 0 4px 12px rgba(0,0,0,.05);
      --shadow-md: 0 12px 32px rgba(0,0,0,.08);
      --radius-pill: 50px; --radius-card: 24px;
      --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #4f46e5;
    }

    .portal-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .portal-sidebar {
      background: var(--primary); color: #fff; padding: 24px 0;
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .portal-brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 16px; }
    .portal-brand img { height: 40px; filter: brightness(0) invert(1); opacity: .95; }
    .portal-nav { list-style: none; padding: 0 12px; flex: 1; }
    .portal-nav li { margin-bottom: 4px; }
    .portal-nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 12px;
      font-size: 0.92rem; font-weight: 500;
      color: rgba(255,255,255,.7); transition: all .2s;
    }
    .portal-nav a i { width: 18px; text-align: center; font-size: 0.95rem; }
    .portal-nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
    .portal-nav a.active { background: var(--accent); color: #fff; }
    .portal-user {
      padding: 16px 24px; border-top: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; gap: 12px;
    }
    .portal-user img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .portal-user-info { flex: 1; min-width: 0; }
    .portal-user-info h4 { font-size: 0.85rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .portal-user-info span { font-size: 0.7rem; color: rgba(255,255,255,.55); }
    .portal-signout { color: rgba(255,255,255,.5); font-size: .9rem; transition: color .2s; }
    .portal-signout:hover { color: var(--accent); }

    .portal-main { padding: 32px 40px 80px; max-width: 1200px; width: 100%; }
    .portal-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; gap: 20px; flex-wrap: wrap;
    }
    .portal-topbar h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .portal-topbar p { color: var(--text-muted); font-size: .95rem; margin-top: 4px; }

    /* Tabs */
    .main-tabs {
      display: flex; gap: 4px; border-bottom: 1px solid var(--border-color);
      margin-bottom: 28px; overflow-x: auto;
    }
    .main-tab {
      padding: 14px 22px;
      font-size: .92rem; font-weight: 600;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      transition: all .2s;
      display: inline-flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .main-tab i { font-size: .9rem; }
    .main-tab:hover { color: var(--primary); }
    .main-tab.active { color: var(--primary); border-bottom-color: var(--accent); }
    .main-tab .count {
      background: #f3f2ef; color: var(--text-muted);
      font-size: .7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
    }
    .main-tab.active .count { background: var(--accent-soft); color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Review cards */
    .reviews-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .review-card {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 14px;
    }
    .review-head {
      display: flex; align-items: flex-start; gap: 14px;
    }
    .review-avatar {
      width: 48px; height: 48px;
      border-radius: 50%; object-fit: cover;
      flex-shrink: 0;
      background: #f3f2ef;
    }
    .review-meta { flex: 1; min-width: 0; }
    .review-to {
      font-size: .95rem; font-weight: 700; color: var(--primary);
      margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .review-gig {
      font-size: .82rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .review-stars { color: var(--accent); font-size: 1rem; letter-spacing: 1px; }
    .review-stars .off { color: #d1cfc9; }
    .review-text {
      font-size: .9rem; color: var(--text-main);
      line-height: 1.6; white-space: pre-line;
    }
    .review-date { font-size: .75rem; color: var(--text-muted); }
    
    /* Status Pills */
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
      width: fit-content;
    }
    .status-pill.pending { background: #fff7e6; color: var(--amber); }
    .status-pill.approved { background: #e8f8ee; color: var(--green); }
    .status-pill.rejected { background: #fdeaea; color: var(--red); }

    /* Buttons */
    .btn-primary {
      padding: 10px 20px; border-radius: var(--radius-pill);
      background: var(--accent); color: #fff;
      font-weight: 600; font-size: .85rem;
      transition: background .2s; display: inline-flex; align-items: center; gap: 8px;
      width: fit-content;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Empty states */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      background: var(--white);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-card);
      color: var(--text-muted);
    }
    .empty-state i { font-size: 2.4rem; opacity: .4; margin-bottom: 14px; display: block; }
    .empty-state h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 6px; }
    .empty-state p { font-size: .9rem; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--primary); color: #fff;
      padding: 14px 22px; border-radius: 12px;
      font-size: .9rem; font-weight: 500;
      box-shadow: var(--shadow-md);
      transform: translateY(120%); opacity: 0;
      transition: all .3s ease; z-index: 9999;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: var(--red); }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(250,250,249,.9);
      backdrop-filter: blur(2px); z-index: 5000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      color: var(--text-muted); font-size: .95rem;
    }
    .loading-overlay .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay.hidden { display: none; }

    @media (max-width: 900px) {
      .portal-shell { grid-template-columns: 1fr; }
      .portal-sidebar { position: fixed; left: 0; top: 0; width: 260px; transform: translateX(-100%); transition: transform .3s; z-index: 1001; }
      .portal-sidebar.open { transform: translateX(0); }
      .portal-mobile-toggle { display: flex !important; position: fixed; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff; align-items: center; justify-content: center; z-index: 1002; font-size: 1.1rem; box-shadow: var(--shadow-md); }
      .portal-main { padding: 80px 16px 40px; }
      .reviews-grid { grid-template-columns: 1fr; }
    }
    .portal-mobile-toggle { display: none; }
    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; opacity: 0; visibility: hidden; transition: all .2s; }
    .sidebar-backdrop.show { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span>Loading reviews…</span>
  </div>

  <button class="portal-mobile-toggle" id="mobileNavToggle"><i class="fas fa-bars"></i></button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="portal-shell">
    <aside class="portal-sidebar" id="portalSidebar">
      <div class="portal-brand">
        <a href="../../index.html"><img src="../../image/vertted-logo.jpeg" alt="Vertted" /></a>
      </div>
      <ul class="portal-nav">
        <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
        <li><a href="inbox.html"><i class="fas fa-comment-dots"></i> Inbox</a></li>
        <li><a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a></li>
        <li><a href="reviews.html" class="active"><i class="fas fa-star"></i> My reviews</a></li>
      </ul>
      <div class="portal-user">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%23e5e3df'/></svg>" id="portalUserAvatar" alt="User" />
        <div class="portal-user-info">
          <h4 id="portalUserName">Loading…</h4>
          <span>Client</span>
        </div>
        <button class="portal-signout" id="signOutBtn" title="Sign out"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <main class="portal-main">
      <div class="portal-topbar">
        <div>
          <h1>My Reviews</h1>
          <p>Manage the feedback you've given to freelancers.</p>
        </div>
      </div>

      <div class="main-tabs" id="mainTabs">
        <button class="main-tab active" data-tab="to-write">
          <i class="fas fa-pen"></i> Reviews to Write <span class="count" id="countToWrite">0</span>
        </button>
        <button class="main-tab" data-tab="written">
          <i class="fas fa-check-circle"></i> Reviews Written <span class="count" id="countWritten">0</span>
        </button>
      </div>

      <!-- Tab: To Write -->
      <div class="tab-panel active" id="panelToWrite">
        <div class="reviews-grid" id="gridToWrite"></div>
      </div>

      <!-- Tab: Written -->
      <div class="tab-panel" id="panelWritten">
        <div class="reviews-grid" id="gridWritten"></div>
      </div>

    </main>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import {
      getFirestore, collection, query, where, onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsL6tQHjXqTK0NTSDgb6SMS_1_ode2whQ",
      authDomain: "vertted-28f7f.firebaseapp.com",
      projectId: "vertted-28f7f",
      storageBucket: "vertted-28f7f.firebasestorage.app",
      messagingSenderId: "912377837951",
      appId: "1:912377837951:web:c5550721e51b2a3a5f824a",
      measurementId: "G-Q4FQ96Q25T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    let currentUser = null;
    let writtenReviews = [];
    let completedOrders = [];
    let pendingOrders = []; // Orders completed but not reviewed

    const toastEl = $('toast');
    let toastTimer;
    function toast(msg, type = 'success') {
      toastEl.className = `toast ${type}`;
      $('toastMsg').textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
    }

    function initialsAvatar(name) {
      const letter = (name || 'U').trim().charAt(0).toUpperCase();
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='%23f26b21'/><text x='50%' y='55%' font-family='Inter,sans-serif' font-size='18' fill='white' text-anchor='middle' dominant-baseline='middle'>${letter}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + svg;
    }

    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderStars(rating) {
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<i class="fas fa-star ${i <= rating ? '' : 'off'}"></i>`;
      }
      return html;
    }

    // ==========================================
    // Auth
    // ==========================================
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      $('portalUserName').textContent = user.displayName || 'Client';
      $('portalUserAvatar').src = user.photoURL || initialsAvatar(user.displayName);

      await loadData();
      $('loadingOverlay').classList.add('hidden');
    });

    $('signOutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });

    $('mobileNavToggle').addEventListener('click', () => {
      $('portalSidebar').classList.toggle('open');
      $('sidebarBackdrop').classList.toggle('show');
    });
    $('sidebarBackdrop').addEventListener('click', () => {
      $('portalSidebar').classList.remove('open');
      $('sidebarBackdrop').classList.remove('show');
    });

    // ==========================================
    // Tabs Logic
    // ==========================================
    document.querySelectorAll('.main-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        
        tab.classList.add('active');
        $(`panel${tab.dataset.tab === 'to-write' ? 'ToWrite' : 'Written'}`).classList.add('active');
      });
    });

    // ==========================================
    // Load Data
    // ==========================================
    async function loadData() {
      // 1. Fetch Reviews Written by Client
      const reviewsQuery = query(
        collection(db, 'reviews'),
        where('clientUid', '==', currentUser.uid)
      );
      
      const reviewsSnap = await getDocs(reviewsQuery);
      writtenReviews = [];
      reviewsSnap.forEach(d => writtenReviews.push({ id: d.id, ...d.data() }));
      writtenReviews.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      // 2. Fetch Completed Orders by Client
      const ordersQuery = query(
        collection(db, 'orders'),
        where('clientUid', '==', currentUser.uid),
        where('status', '==', 'completed')
      );
      
      const ordersSnap = await getDocs(ordersQuery);
      completedOrders = [];
      ordersSnap.forEach(d => completedOrders.push({ id: d.id, ...d.data() }));

      // 3. Determine pending reviews (Completed orders without a review)
      const reviewedOrderIds = new Set(writtenReviews.map(r => r.orderId));
      pendingOrders = completedOrders.filter(o => !reviewedOrderIds.has(o.id));
      pendingOrders.sort((a, b) => (b.completedAt?.seconds || 0) - (a.completedAt?.seconds || 0));

      // 4. Update counts and render
      $('countToWrite').textContent = pendingOrders.length;
      $('countWritten').textContent = writtenReviews.length;

      renderToWrite();
      renderWritten();
    }

    // ==========================================
    // Render: Reviews to Write
    // ==========================================
    function renderToWrite() {
      const grid = $('gridToWrite');
      
      if (pendingOrders.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-mug-hot"></i>
            <h3>You're all caught up!</h3>
            <p>You have no completed orders waiting for a review.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = pendingOrders.map(o => `
        <div class="review-card">
          <div class="review-head">
            <img class="review-avatar" src="${o.freelancerAvatar || initialsAvatar(o.freelancerName)}" alt="${escapeHTML(o.freelancerName)}" />
            <div class="review-meta">
              <div class="review-to">${escapeHTML(o.freelancerName || 'Freelancer')}</div>
              <div class="review-gig">${escapeHTML(o.title || 'Untitled gig')}</div>
              <div class="review-date">Completed on ${formatDate(o.completedAt)}</div>
            </div>
          </div>
          <button class="btn-primary" onclick="openReview('${o.id}', '${o.freelancerUid}', '${escapeHTML(o.title || '')}')">
            <i class="fas fa-pen"></i> Write a Review
          </button>
        </div>
      `).join('');
    }

    // ==========================================
    // Render: Reviews Written
    // ==========================================
    function renderWritten() {
      const grid = $('gridWritten');
      
      if (writtenReviews.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-star"></i>
            <h3>No reviews written yet</h3>
            <p>When you complete an order, you can leave a review for the freelancer.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = writtenReviews.map(r => {
        const order = completedOrders.find(o => o.id === r.orderId);
        const freelancerName = order?.freelancerName || r.freelancerName || 'Freelancer';
        const gigTitle = order?.title || r.gigTitle || 'Gig';
        const avatar = order?.freelancerAvatar || initialsAvatar(freelancerName);
        
        return `
          <div class="review-card">
            <div class="review-head">
              <img class="review-avatar" src="${avatar}" alt="${escapeHTML(freelancerName)}" />
              <div class="review-meta">
                <div class="review-to">${escapeHTML(freelancerName)}</div>
                <div class="review-gig">${escapeHTML(gigTitle)}</div>
                <div class="review-date">${formatDate(r.createdAt)}</div>
              </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="review-stars">${renderStars(r.rating || 0)}</div>
              <div class="status-pill ${r.status || 'pending'}">
                ${r.status === 'approved' ? '<i class="fas fa-check-circle"></i> Published' :
                  r.status === 'rejected' ? '<i class="fas fa-times-circle"></i> Rejected' :
                  '<i class="fas fa-hourglass-half"></i> Pending Approval'}
              </div>
            </div>
            
            <div class="review-text">"${escapeHTML(r.text || '')}"</div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // Action
    // ==========================================
    window.openReview = function(orderId, freelancerUid, gigTitle) {
      const params = new URLSearchParams({
        orderId: orderId,
        freelancerUid: freelancerUid,
        gigTitle: gigTitle
      });
      window.open(`../../review.html?${params.toString()}`, '_blank');
    };
  </script>
</body>
</html>
