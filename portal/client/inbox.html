<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox — Vertted Client</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #fafaf9; color: #1a1a24; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; background: none; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    :root {
      --primary: #1e2b4f; --primary-dark: #151d36;
      --accent: #f26b21; --accent-hover: #d95b17; --accent-soft: #fdf2e8;
      --text-main: #1a1a24; --text-muted: #5e5e6b;
      --border-color: #e5e3df; --white: #fff;
      --shadow-sm: 0 4px 12px rgba(0,0,0,.05);
      --shadow-md: 0 12px 32px rgba(0,0,0,.08);
      --radius-pill: 50px; --radius-card: 24px;
      --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #4f46e5;
    }

    /* ===== PORTAL SHELL ===== */
    .portal-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .portal-sidebar {
      background: var(--primary); color: #fff; padding: 24px 0;
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .portal-brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 16px; }
    .portal-brand img { height: 40px; filter: brightness(0) invert(1); opacity: .95; }
    .portal-nav { list-style: none; padding: 0 12px; flex: 1; }
    .portal-nav li { margin-bottom: 4px; }
    .portal-nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 12px;
      font-size: 0.92rem; font-weight: 500;
      color: rgba(255,255,255,.7); transition: all .2s;
    }
    .portal-nav a i { width: 18px; text-align: center; font-size: 0.95rem; }
    .portal-nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
    .portal-nav a.active { background: var(--accent); color: #fff; }
    .portal-nav .badge {
      margin-left: auto;
      background: rgba(255,255,255,.15);
      font-size: .7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
    }
    .portal-user {
      padding: 16px 24px; border-top: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; gap: 12px;
    }
    .portal-user img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .portal-user-info { flex: 1; min-width: 0; }
    .portal-user-info h4 { font-size: 0.85rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .portal-user-info span { font-size: 0.7rem; color: rgba(255,255,255,.55); }
    .portal-signout { color: rgba(255,255,255,.5); font-size: .9rem; transition: color .2s; }
    .portal-signout:hover { color: var(--accent); }

    /* ===== INBOX LAYOUT ===== */
    .portal-main { padding: 24px 32px; height: 100vh; display: flex; flex-direction: column; max-width: 1500px; width: 100%; }
    .portal-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; gap: 20px; flex-wrap: wrap; flex-shrink: 0;
    }
    .portal-topbar h1 { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .portal-topbar p { color: var(--text-muted); font-size: .9rem; margin-top: 2px; }

    .inbox-grid {
      display: grid; grid-template-columns: 340px 1fr; gap: 0;
      flex: 1; min-height: 0;
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    /* ===== THREADS LIST ===== */
    .threads-pane { border-right: 1px solid var(--border-color); display: flex; flex-direction: column; min-height: 0; background: #fafaf9; }
    .threads-search { padding: 14px; border-bottom: 1px solid var(--border-color); background: var(--white); }
    .threads-search input {
      width: 100%; padding: 10px 14px 10px 40px;
      border-radius: 12px; border: 1px solid var(--border-color);
      font-family: 'Inter', sans-serif; font-size: .88rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .threads-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,43,79,.08); }
    .threads-search .search-icon { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: .85rem; pointer-events: none; }
    .threads-search-wrap { position: relative; }

    .threads-list { flex: 1; overflow-y: auto; list-style: none; }
    .thread-item {
      padding: 14px 16px; border-bottom: 1px solid var(--border-color);
      cursor: pointer; display: flex; gap: 12px;
      transition: background .15s; position: relative;
    }
    .thread-item:hover { background: #f3f2ef; }
    .thread-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 13px; }
    .thread-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .thread-body { flex: 1; min-width: 0; }
    .thread-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .thread-name { font-size: .92rem; font-weight: 600; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-time { font-size: .72rem; color: var(--text-muted); flex-shrink: 0; }
    .thread-preview { font-size: .82rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
    .thread-preview.unread { color: var(--primary); font-weight: 500; }
    .thread-unread-badge {
      position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
      background: var(--accent); color: #fff;
      min-width: 20px; height: 20px; border-radius: 20px;
      font-size: .7rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px;
    }
    .threads-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: .88rem; flex: 1; }
    .threads-empty i { font-size: 2rem; margin-bottom: 12px; opacity: .5; }

    /* ===== CONVERSATION ===== */
    .conversation-pane { display: flex; flex-direction: column; min-height: 0; background: var(--white); position: relative; }
    .conversation-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 40px; }
    .conversation-placeholder i { font-size: 3rem; margin-bottom: 16px; opacity: .4; }
    .conversation-placeholder h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 6px; }
    .conversation-placeholder p { font-size: .9rem; max-width: 320px; }

    .conv-header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 14px; background: var(--white); flex-shrink: 0; }
    .conv-header .thread-avatar { width: 40px; height: 40px; }
    .conv-header-info { flex: 1; min-width: 0; }
    .conv-header-info h3 { font-size: 1rem; font-weight: 700; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-header-info p { font-size: .78rem; color: var(--text-muted); }
    .conv-actions { display: flex; gap: 6px; }
    .conv-action-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: #f3f2ef; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s; font-size: .9rem;
    }
    .conv-action-btn:hover { background: #e5e3df; color: var(--primary); }

    .conv-messages { flex: 1; overflow-y: auto; padding: 20px 24px; background: #fafaf9; display: flex; flex-direction: column; gap: 12px; }

    .msg-row { display: flex; gap: 10px; max-width: 78%; }
    .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.mine .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg-row.theirs .msg-bubble { background: var(--white); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }

    .msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; align-self: flex-end; }
    .msg-bubble { border-radius: 16px; padding: 10px 14px; font-size: .9rem; line-height: 1.45; position: relative; word-break: break-word; }
    .msg-time { font-size: .68rem; opacity: .65; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .msg-row.mine .msg-time { justify-content: flex-end; }

    /* Offer card */
    .msg-bubble.offer-card,
    .msg-bubble.delivery-card { background: var(--white); border: 1px solid var(--border-color); padding: 0; overflow: hidden; max-width: 380px; }
    .msg-row.mine .msg-bubble.offer-card,
    .msg-row.mine .msg-bubble.delivery-card { background: var(--white); color: var(--text-main); }
    .msg-row.mine .msg-bubble.offer-card .msg-time,
    .msg-row.mine .msg-bubble.delivery-card .msg-time { color: var(--text-muted); opacity: 1; }
    .card-header { padding: 14px 18px; background: var(--accent-soft); border-bottom: 1px solid var(--border-color); }
    .card-header.delivery { background: #e8f8ee; }
    .card-type { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .card-header.delivery .card-type { color: var(--green); }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .card-body { padding: 14px 18px; }
    .card-amount { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .card-meta { display: flex; gap: 14px; font-size: .82rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-meta i { margin-right: 4px; }
    .card-scope { font-size: .85rem; color: var(--text-main); line-height: 1.5; padding: 10px 12px; background: #fafaf9; border-radius: 10px; margin-bottom: 12px; white-space: pre-line; }
    .card-files { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .card-files li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fafaf9; border-radius: 8px; font-size: .82rem; }
    .card-files li i { color: var(--accent); }
    .card-files li a { color: var(--text-main); font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-files li .size { color: var(--text-muted); font-size: .75rem; }
    .card-actions { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border-color); }
    .card-btn { flex: 1; padding: 9px 12px; border-radius: var(--radius-pill); font-size: .82rem; font-weight: 600; transition: all .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .card-btn.accept { background: var(--green); color: #fff; }
    .card-btn.accept:hover { filter: brightness(.95); }
    .card-btn.decline { background: #fdeaea; color: var(--red); }
    .card-btn.decline:hover { background: #fbd5d5; }
    .card-btn.revision { background: #fff7e6; color: var(--amber); }
    .card-btn.revision:hover { background: #fdeebf; }
    .card-btn.ghost { background: #f3f2ef; color: var(--text-main); }
    .card-btn.ghost:hover { background: #e5e3df; }
    .card-btn:disabled { opacity: .5; cursor: not-allowed; }
    .card-status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600; }
    .card-status.pending { background: #fff7e6; color: var(--amber); }
    .card-status.accepted { background: #e8f8ee; color: var(--green); }
    .card-status.declined { background: #fdeaea; color: var(--red); }
    .card-status.delivered { background: #e8f8ee; color: var(--green); }

    .system-msg { align-self: center; background: #f3f2ef; color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: .78rem; max-width: 80%; text-align: center; }

    /* Composer */
    .conv-composer { padding: 14px 20px; border-top: 1px solid var(--border-color); background: var(--white); flex-shrink: 0; }
    .composer-actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .composer-action { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-pill); background: #f3f2ef; color: var(--text-main); font-size: .82rem; font-weight: 600; transition: all .2s; }
    .composer-action:hover { background: #e5e3df; }
    .composer-action.primary { background: var(--accent-soft); color: var(--accent); }
    .composer-action.primary:hover { background: #fce3cc; }

    .composer-row { display: flex; align-items: flex-end; gap: 10px; }
    .composer-input-wrap {
      flex: 1; border: 1px solid var(--border-color); border-radius: 22px;
      padding: 8px 8px 8px 16px; display: flex; align-items: flex-end;
      background: var(--white); transition: border-color .2s, box-shadow .2s;
    }
    .composer-input-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,43,79,.08); }
    .composer-input-wrap textarea {
      flex: 1; border: 0; outline: 0; resize: none; max-height: 120px;
      font-family: 'Inter', sans-serif; font-size: .92rem; line-height: 1.4;
      background: transparent; padding: 6px 0;
    }
    .send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s; flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      backdrop-filter: blur(3px); z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; visibility: hidden;
      transition: all .25s; overflow-y: auto;
    }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    .modal-panel {
      background: var(--white); border-radius: var(--radius-card);
      width: 100%; max-width: 560px; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,.18);
      transform: translateY(-12px); transition: transform .3s;
      margin: auto;
    }
    .modal-backdrop.show .modal-panel { transform: translateY(0); }
    .modal-header { padding: 22px 26px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
    .modal-close { width: 34px; height: 34px; border-radius: 10px; background: #f3f2ef; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: background .2s; }
    .modal-close:hover { background: #e5e3df; }
    .modal-body { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { padding: 16px 26px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }

    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-row label { font-size: .82rem; font-weight: 600; color: var(--primary); }
    .form-input, .form-textarea {
      border: 1px solid var(--border-color); border-radius: 12px;
      padding: 11px 14px; font-family: 'Inter', sans-serif;
      font-size: .92rem; color: var(--text-main);
      background: var(--white); transition: border-color .2s, box-shadow .2s; width: 100%;
    }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,43,79,.08); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-primary { padding: 11px 24px; border-radius: var(--radius-pill); background: var(--accent); color: #fff; font-weight: 600; font-size: .9rem; transition: background .2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-secondary { padding: 11px 24px; border-radius: var(--radius-pill); border: 1px solid var(--border-color); background: var(--white); color: var(--text-main); font-weight: 600; font-size: .9rem; transition: background .2s; }
    .btn-secondary:hover { background: #fafaf9; }

    /* File drop */
    .file-drop { border: 2px dashed var(--border-color); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; transition: all .2s; background: #fafaf9; }
    .file-drop:hover, .file-drop.dragover { border-color: var(--accent); background: var(--accent-soft); }
    .file-drop i { font-size: 1.4rem; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .file-drop p { font-size: .85rem; color: var(--text-main); font-weight: 500; margin-bottom: 2px; }
    .file-drop small { font-size: .75rem; color: var(--text-muted); }
    .file-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .file-list li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fafaf9; border-radius: 8px; font-size: .82rem; }
    .file-list li i { color: var(--accent); }
    .file-list li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-list li button { color: var(--red); font-size: .85rem; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--primary); color: #fff;
      padding: 14px 22px; border-radius: 12px;
      font-size: .9rem; font-weight: 500;
      box-shadow: var(--shadow-md);
      transform: translateY(120%); opacity: 0;
      transition: all .3s ease; z-index: 9999;
      display: flex; align-items: center; gap: 10px;
      max-width: calc(100vw - 48px);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }

    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(250,250,249,.9);
      backdrop-filter: blur(2px); z-index: 5000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      color: var(--text-muted); font-size: .95rem;
    }
    .loading-overlay .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay.hidden { display: none; }

    .threads-list::-webkit-scrollbar, .conv-messages::-webkit-scrollbar { width: 6px; }
    .threads-list::-webkit-scrollbar-thumb, .conv-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 6px; }

    @media (max-width: 900px) {
      .portal-shell { grid-template-columns: 1fr; }
      .portal-sidebar {
        position: fixed; left: 0; top: 0; width: 260px;
        transform: translateX(-100%); transition: transform .3s; z-index: 1001;
      }
      .portal-sidebar.open { transform: translateX(0); }
      .portal-mobile-toggle {
        display: flex !important;
        position: fixed; top: 16px; left: 16px;
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--primary); color: #fff;
        align-items: center; justify-content: center;
        z-index: 1002; font-size: 1.1rem; box-shadow: var(--shadow-md);
      }
      .portal-main { padding: 80px 12px 12px; height: 100vh; }
      .inbox-grid { grid-template-columns: 1fr; }
      .threads-pane { display: none; }
      .threads-pane.mobile-show { display: flex; }
      .conversation-pane.mobile-hide { display: none; }
      .conv-back-btn { display: flex !important; }
      .form-grid { grid-template-columns: 1fr; }
    }
    .portal-mobile-toggle { display: none; }
    .conv-back-btn { display: none; }
    .sidebar-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 1000; opacity: 0; visibility: hidden; transition: all .2s;
    }
    .sidebar-backdrop.show { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span>Loading inbox…</span>
  </div>

  <button class="portal-mobile-toggle" id="mobileNavToggle"><i class="fas fa-bars"></i></button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="portal-shell">
    <aside class="portal-sidebar" id="portalSidebar">
      <div class="portal-brand">
        <!-- FIXED IMAGE PATH -->
        <a href="../../index.html"><img src="../../image/vertted-logo.jpeg" alt="Vertted" /></a>
      </div>
      <ul class="portal-nav">
        <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
        <li><a href="inbox.html" class="active"><i class="fas fa-comment-dots"></i> Inbox <span class="badge" id="navMsgBadge" style="display:none;">0</span></a></li>
        <li><a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a></li>
        <li><a href="reviews.html"><i class="fas fa-star"></i> My reviews</a></li>
      </ul>
      <div class="portal-user">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%23e5e3df'/></svg>" id="portalUserAvatar" alt="User" />
        <div class="portal-user-info">
          <h4 id="portalUserName">Loading…</h4>
          <span>Client</span>
        </div>
        <button class="portal-signout" id="signOutBtn" title="Sign out"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <main class="portal-main">
      <div class="portal-topbar">
        <div>
          <h1>Inbox</h1>
          <p>Chat with freelancers, accept offers, and receive deliveries.</p>
        </div>
      </div>

      <div class="inbox-grid">

        <aside class="threads-pane" id="threadsPane">
          <div class="threads-search">
            <div class="threads-search-wrap">
              <i class="fas fa-search search-icon"></i>
              <input type="text" id="threadSearch" placeholder="Search conversations…" />
            </div>
          </div>
          <ul class="threads-list" id="threadsList">
            <li class="threads-empty" id="threadsEmpty">
              <i class="fas fa-comments"></i>
              <span>Loading conversations…</span>
            </li>
          </ul>
        </aside>

        <section class="conversation-pane" id="conversationPane">
          <div class="conversation-placeholder" id="conversationPlaceholder">
            <i class="fas fa-comment-dots"></i>
            <h3>Select a conversation</h3>
            <p>Choose a freelancer from the left to see your messages, offers, and deliveries.</p>
          </div>

          <div id="conversationActive" style="display:none; flex-direction:column; flex:1; min-height:0;">
            <div class="conv-header">
              <button class="conv-action-btn conv-back-btn" id="convBackBtn" style="margin-right:4px;"><i class="fas fa-arrow-left"></i></button>
              <img class="thread-avatar" id="convAvatar" alt="Freelancer" />
              <div class="conv-header-info">
                <h3 id="convName">Freelancer</h3>
                <p id="convSubtitle"></p>
              </div>
              <div class="conv-actions">
                <button class="conv-action-btn" id="convProfileBtn" title="View profile"><i class="fas fa-user"></i></button>
                <button class="conv-action-btn" id="convRefreshBtn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
              </div>
            </div>

            <div class="conv-messages" id="convMessages"></div>

            <div class="conv-composer">
              <div class="composer-actions">
                <button class="composer-action primary" id="sendOfferBtn" style="display:none;"><i class="fas fa-tag"></i> Send offer</button>
                <button class="composer-action" id="sendDeliveryBtn" style="display:none;"><i class="fas fa-box-open"></i> Send delivery</button>
              </div>
              <div class="composer-row">
                <div class="composer-input-wrap">
                  <textarea id="composerInput" rows="1" placeholder="Type your message…"></textarea>
                </div>
                <button class="send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
              </div>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import {
      getFirestore, collection, query, where, orderBy, onSnapshot,
      doc, getDoc, addDoc, updateDoc, serverTimestamp, increment, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsL6tQHjXqTK0NTSDgb6SMS_1_ode2whQ",
      authDomain: "vertted-28f7f.firebaseapp.com",
      projectId: "vertted-28f7f",
      storageBucket: "vertted-28f7f.firebasestorage.app",
      messagingSenderId: "912377837951",
      appId: "1:912377837951:web:c5550721e51b2a3a5f824a",
      measurementId: "G-Q4FQ96Q25T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let threads = [];
    let activeThreadId = null;
    let unsubThreads = null;
    let unsubMessages = null;
    let messageCache = [];

    const $ = (id) => document.getElementById(id);

    // Helpers
    const toastEl = $('toast');
    let toastTimer;
    function toast(msg, type = 'success') {
      toastEl.className = `toast ${type}`;
      $('toastMsg').textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
    }
    function initialsAvatar(name) {
      const letter = (name || 'U').trim().charAt(0).toUpperCase();
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='%23f26b21'/><text x='50%' y='55%' font-family='Inter,sans-serif' font-size='18' fill='white' text-anchor='middle' dominant-baseline='middle'>${letter}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + svg;
    }
    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function formatTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function formatDayLabel(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const today = new Date();
      const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
      if (d.toDateString() === today.toDateString()) return 'Today';
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
    }
    function timeAgo(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return 'now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h';
      return Math.floor(diff / 86400) + 'd';
    }

    // ==========================================
    // Auth
    // ==========================================
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      $('portalUserName').textContent = user.displayName || 'Client';
      $('portalUserAvatar').src = user.photoURL || initialsAvatar(user.displayName);

      loadThreads();

      // Deep-link handling
      const urlParams = new URLSearchParams(window.location.search);
      const wanted = urlParams.get('thread');
      const action = urlParams.get('action');   // 'accept' | 'decline'
      if (wanted) {
        const tryOpen = setInterval(() => {
          if (threads.find(t => t.id === wanted)) {
            clearInterval(tryOpen);
            selectThread(wanted).then(() => {
              if (action) {
                setTimeout(() => triggerDeepLinkAction(action), 800);
              }
            });
          }
        }, 200);
        setTimeout(() => clearInterval(tryOpen), 5000);
      }
    });

    function triggerDeepLinkAction(action) {
      const buttons = document.querySelectorAll('.offer-card [data-offer-action]');
      if (!buttons.length) return;
      const lastCard = document.querySelector('.offer-card:last-of-type') || document.querySelector('.offer-card');
      if (!lastCard) return;
      const wantedBtn = lastCard.querySelector(`[data-offer-action="${action === 'accept' ? 'accept' : 'decline'}"]`);
      if (wantedBtn && !wantedBtn.disabled) wantedBtn.click();
    }

    $('signOutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });
    $('mobileNavToggle').addEventListener('click', () => {
      $('portalSidebar').classList.toggle('open');
      $('sidebarBackdrop').classList.toggle('show');
    });
    $('sidebarBackdrop').addEventListener('click', () => {
      $('portalSidebar').classList.remove('open');
      $('sidebarBackdrop').classList.remove('show');
    });

    // ==========================================
    // Load threads (FIXED NAME/AVATAR LOGIC)
    // ==========================================
    function loadThreads() {
      if (unsubThreads) unsubThreads();
      const q = query(
        collection(db, 'threads'),
        where('participants', 'array-contains', currentUser.uid)
      );
      
      unsubThreads = onSnapshot(q, async (snap) => {
        let tempThreads = [];
        let totalUnread = 0;
        
        // Use Promise.all to fetch missing profiles if names are missing
        const promises = snap.docs.map(async (d) => {
          const data = d.data();
          const otherUid = (data.participants || []).find(uid => uid !== currentUser.uid);
          
          let otherName = data.otherName || data.clientName || data.freelancerName;
          let otherAvatar = data.otherAvatar || data.clientAvatar || data.freelancerAvatar;

          // If the thread document didn't save the names correctly, fetch from profile
          if (!otherName || otherName === 'Freelancer' || otherName === 'Client') {
            try {
              const pSnap = await getDoc(doc(db, 'profiles', otherUid));
              if (pSnap.exists()) {
                const pData = pSnap.data();
                otherName = pData.displayName || pData.fullName || 'User';
                otherAvatar = pData.photoURL;
              }
            } catch (e) { console.error("Could not fetch profile for", otherUid, e); }
          }

          // Fallback if still missing
          otherName = otherName || 'Freelancer';
          totalUnread += (data.unreadBy?.[currentUser.uid] || 0);

          return { 
            id: d.id, 
            ...data, 
            otherUid, 
            otherName: otherName, 
            otherAvatar 
          };
        });

        tempThreads = await Promise.all(promises);
        threads = tempThreads.sort((a, b) => (b.lastMessageAt?.seconds || 0) - (a.lastMessageAt?.seconds || 0));

        const badge = $('navMsgBadge');
        badge.textContent = totalUnread;
        badge.style.display = totalUnread > 0 ? 'inline-block' : 'none';

        renderThreads();
        $('loadingOverlay').classList.add('hidden');
      }, (err) => {
        console.error('threads listener', err);
        $('loadingOverlay').classList.add('hidden');
        toast('Could not load conversations', 'error');
      });
    }

    function renderThreads() {
      const list = $('threadsList');
      const search = $('threadSearch').value.trim().toLowerCase();

      const filtered = threads.filter(t => {
        if (!search) return true;
        return (t.otherName || '').toLowerCase().includes(search) ||
               (t.lastMessage || '').toLowerCase().includes(search);
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <li class="threads-empty">
            <i class="fas fa-comments"></i>
            <span>${threads.length === 0 ? 'No conversations yet. Contact a freelancer to start one.' : 'No conversations match your search.'}</span>
          </li>
        `;
        return;
      }

      list.innerHTML = filtered.map(t => {
        const unread = t.unreadBy?.[currentUser.uid] || 0;
        const active = t.id === activeThreadId;
        return `
          <li class="thread-item ${active ? 'active' : ''}" data-thread-id="${t.id}">
            <img class="thread-avatar" src="${t.otherAvatar || initialsAvatar(t.otherName)}" alt="${escapeHTML(t.otherName)}" />
            <div class="thread-body">
              <div class="thread-head">
                <span class="thread-name">${escapeHTML(t.otherName)}</span>
                <span class="thread-time">${timeAgo(t.lastMessageAt)}</span>
              </div>
              <div class="thread-preview ${unread > 0 ? 'unread' : ''}">${escapeHTML(t.lastMessage || 'No messages yet')}</div>
            </div>
            ${unread > 0 ? `<span class="thread-unread-badge">${unread}</span>` : ''}
          </li>
        `;
      }).join('');

      list.querySelectorAll('.thread-item').forEach(li => {
        li.addEventListener('click', () => selectThread(li.dataset.threadId));
      });
    }

    $('threadSearch').addEventListener('input', renderThreads);

    // ==========================================
    // Select thread
    // ==========================================
    async function selectThread(threadId) {
      if (!threadId) return; // Guard against null
      if (activeThreadId === threadId) return;
      activeThreadId = threadId;

      if (window.innerWidth <= 900) {
        $('threadsPane').classList.remove('mobile-show');
        $('conversationPane').classList.remove('mobile-hide');
      }

      const thread = threads.find(t => t.id === threadId);
      if (!thread) return;

      $('conversationPlaceholder').style.display = 'none';
      $('conversationActive').style.display = 'flex';

      $('convAvatar').src = thread.otherAvatar || initialsAvatar(thread.otherName);
      $('convName').textContent = thread.otherName;
      $('convSubtitle').textContent = 'Tap for details';

      if (thread.unreadBy?.[currentUser.uid]) {
        try {
          await updateDoc(doc(db, 'threads', threadId), {
            [`unreadBy.${currentUser.uid}`]: 0
          });
        } catch (e) {}
      }

      loadMessages(threadId);
      renderThreads();
    }

    // ==========================================
    // Messages
    // ==========================================
    function loadMessages(threadId) {
      if (!threadId) return; // Guard against null
      if (unsubMessages) unsubMessages();
      const msgsRef = collection(db, 'threads', threadId, 'messages');
      const q = query(msgsRef, orderBy('createdAt', 'asc'), limit(300));
      unsubMessages = onSnapshot(q, (snap) => {
        messageCache = [];
        snap.forEach(d => messageCache.push({ id: d.id, ...d.data() }));
        renderMessages();
      }, (err) => {
        console.error('messages listener', err);
      });
    }

    function renderMessages() {
      const wrap = $('convMessages');
      const thread = threads.find(t => t.id === activeThreadId);
      if (!thread) return;

      let lastDay = '';
      let html = '';

      messageCache.forEach(m => {
        const day = formatDayLabel(m.createdAt);
        if (day && day !== lastDay) {
          html += `<div style="align-self:center;font-size:.7rem;color:var(--text-muted);background:#f3f2ef;padding:4px 12px;border-radius:20px;font-weight:600;">${day}</div>`;
          lastDay = day;
        }
        html += renderMessage(m, thread);
      });

      if (messageCache.length === 0) {
        html = `<div class="system-msg">Say hello 👋</div>`;
      }

      wrap.innerHTML = html;
      bindCardActions();
      wrap.scrollTop = wrap.scrollHeight;
    }

    function renderMessage(m, thread) {
      const mine = m.senderUid === currentUser.uid;
      const sideClass = mine ? 'mine' : 'theirs';

      if (m.type === 'system') {
        return `<div class="system-msg">${escapeHTML(m.text || '')}</div>`;
      }

      const avatarUrl = mine
        ? (currentUser.photoURL || initialsAvatar(currentUser.displayName))
        : (thread.otherAvatar || initialsAvatar(thread.otherName));

      if (m.type === 'text') {
        return `
          <div class="msg-row ${sideClass}">
            <img class="msg-avatar" src="${avatarUrl}" alt="" />
            <div class="msg-bubble">
              ${escapeHTML(m.text || '').replace(/\n/g, '<br>')}
              <div class="msg-time">${formatTime(m.createdAt)}</div>
            </div>
          </div>
        `;
      }

      if (m.type === 'offer') return renderOfferCard(m, mine, avatarUrl);
      if (m.type === 'delivery') return renderDeliveryCard(m, mine, avatarUrl);
      return '';
    }

    function renderOfferCard(m, mine, avatarUrl) {
      const o = m.offer || {};
      const status = o.status || 'pending';
      const canRespond = !mine && status === 'pending';

      const statusPill = status !== 'pending'
        ? `<div class="card-status ${status}">${status === 'accepted' ? '<i class="fas fa-check-circle"></i> Accepted' : status === 'declined' ? '<i class="fas fa-times-circle"></i> Declined' : '<i class="fas fa-undo"></i> Withdrawn'}</div>`
        : '';

      const actions = canRespond ? `
        <div class="card-actions">
          <button class="card-btn accept" data-offer-action="accept" data-msg-id="${m.id}"><i class="fas fa-check"></i> Accept</button>
          <button class="card-btn decline" data-offer-action="decline" data-msg-id="${m.id}"><i class="fas fa-times"></i> Decline</button>
        </div>
      ` : (mine && status === 'pending' ? `
        <div class="card-actions">
          <button class="card-btn ghost" data-offer-action="withdraw" data-msg-id="${m.id}"><i class="fas fa-undo"></i> Withdraw</button>
        </div>
      ` : '');

      return `
        <div class="msg-row ${mine ? 'mine' : 'theirs'}">
          <img class="msg-avatar" src="${avatarUrl}" alt="" />
          <div class="msg-bubble offer-card">
            <div class="card-header">
              <div class="card-type"><i class="fas fa-tag"></i> Offer</div>
              <div class="card-title">${escapeHTML(o.title || 'Untitled offer')}</div>
            </div>
            <div class="card-body">
              <div class="card-amount">$${o.amount ?? 0}</div>
              <div class="card-meta">
                <span><i class="fas fa-clock"></i>${o.deliveryDays ?? '—'} days</span>
                ${statusPill}
              </div>
              ${o.scope ? `<div class="card-scope">${escapeHTML(o.scope)}</div>` : ''}
              ${actions}
              <div class="msg-time" style="margin-top:${actions ? '10px' : '0'}">${formatTime(m.createdAt)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDeliveryCard(m, mine, avatarUrl) {
      const d = m.delivery || {};
      const status = m.deliveryStatus || 'delivered';
      const files = d.files || [];

      const statusPill = status === 'accepted'
        ? `<div class="card-status accepted"><i class="fas fa-check-circle"></i> Accepted</div>`
        : status === 'revision_requested'
          ? `<div class="card-status pending"><i class="fas fa-undo"></i> Revision requested</div>`
          : `<div class="card-status delivered"><i class="fas fa-box-open"></i> Delivered</div>`;

      const canRespond = !mine && status === 'delivered';

      const actions = canRespond ? `
        <div class="card-actions">
          <button class="card-btn accept" data-delivery-action="accept" data-msg-id="${m.id}"><i class="fas fa-check"></i> Accept</button>
          <button class="card-btn revision" data-delivery-action="revision" data-msg-id="${m.id}"><i class="fas fa-undo"></i> Request revision</button>
        </div>
      ` : '';

      return `
        <div class="msg-row ${mine ? 'mine' : 'theirs'}">
          <img class="msg-avatar" src="${avatarUrl}" alt="" />
          <div class="msg-bubble delivery-card">
            <div class="card-header delivery">
              <div class="card-type"><i class="fas fa-box-open"></i> Delivery${d.revision ? ' · Revision ' + d.revision : ''}</div>
              <div class="card-title">Files &amp; notes</div>
            </div>
            <div class="card-body">
              <div class="card-meta">${statusPill}</div>
              ${d.note ? `<div class="card-scope">${escapeHTML(d.note)}</div>` : ''}
              ${files.length ? `<ul class="card-files">${files.map(f => `
                <li>
                  <i class="fas fa-file"></i>
                  <a href="${f.url}" target="_blank" rel="noopener">${escapeHTML(f.name)}</a>
                  <span class="size">${formatSize(f.size)}</span>
                </li>
              `).join('')}</ul>` : ''}
              ${actions}
              <div class="msg-time" style="margin-top:${actions ? '10px' : '0'}">${formatTime(m.createdAt)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function formatSize(bytes) {
      if (!bytes) return '';
      const kb = bytes / 1024;
      if (kb < 1024) return kb.toFixed(1) + ' KB';
      return (kb / 1024).toFixed(1) + ' MB';
    }

    // ==========================================
    // Card actions
    // ==========================================
    function bindCardActions() {
      document.querySelectorAll('[data-offer-action]').forEach(btn => {
        btn.addEventListener('click', () => handleOfferAction(btn.dataset.msgId, btn.dataset.offerAction, btn));
      });
      document.querySelectorAll('[data-delivery-action]').forEach(btn => {
        btn.addEventListener('click', () => handleDeliveryAction(btn.dataset.msgId, btn.dataset.deliveryAction, btn));
      });
    }

    async function handleOfferAction(msgId, action, btn) {
      if (!activeThreadId) return; // Guard
      btn.disabled = true;
      try {
        const ref = doc(db, 'threads', activeThreadId, 'messages', msgId);
        const snap = await getDoc(ref);
        if (!snap.exists()) return toast('Offer not found', 'error');
        const data = snap.data();
        const statusMap = { accept: 'accepted', decline: 'declined', withdraw: 'withdrawn' };
        const newStatus = statusMap[action];

        await updateDoc(ref, {
          'offer.status': newStatus,
          ...(action === 'accept' ? { 'offer.acceptedAt': serverTimestamp() } : {})
        });

        const threadUpdate = { lastOfferStatus: newStatus };

        if (action === 'accept') {
          const thread = threads.find(t => t.id === activeThreadId);
          const freelancerUid = data.senderUid;
          const clientUid = currentUser.uid;

          const freelancerName = (thread?.otherName || 'Freelancer');
          const clientName = currentUser.displayName || (currentUser.email || '').split('@')[0] || 'Client';

          const orderRef = await addDoc(collection(db, 'orders'), {
            freelancerUid,
            clientUid,
            freelancerName,
            clientName,
            threadId: activeThreadId,
            offerId: msgId,
            title: data.offer?.title || 'Order',
            amount: data.offer?.amount ?? 0,
            deliveryDays: data.offer?.deliveryDays ?? 0,
            scope: data.offer?.scope || '',
            status: 'active',
            revisionCount: 0,
            revisionsAllowed: 2,
            deliveries: [],
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          threadUpdate.lastOrderId = orderRef.id;

          await addDoc(collection(db, 'threads', activeThreadId, 'messages'), {
            senderUid: currentUser.uid,
            type: 'system',
            text: `Offer accepted — order created.`,
            createdAt: serverTimestamp()
          });

          toast('Offer accepted — order created', 'success');
        } else {
          toast(`Offer ${newStatus}`, 'success');
        }

        await updateDoc(doc(db, 'threads', activeThreadId), threadUpdate);
      } catch (err) {
        console.error(err);
        toast('Could not update offer', 'error');
        btn.disabled = false;
      }
    }

    async function handleDeliveryAction(msgId, action, btn) {
      if (!activeThreadId) return; // Guard
      btn.disabled = true;
      try {
        const ref = doc(db, 'threads', activeThreadId, 'messages', msgId);
        const newStatus = action === 'accept' ? 'accepted' : 'revision_requested';
        await updateDoc(ref, {
          deliveryStatus: newStatus,
          ...(action === 'accept' ? { 'delivery.acceptedAt': serverTimestamp() } : {})
        });

        const snap = await getDoc(ref);
        const data = snap.data();
        if (data.orderId) {
          await updateDoc(doc(db, 'orders', data.orderId), {
            status: action === 'accept' ? 'completed' : 'revision',
            updatedAt: serverTimestamp(),
            ...(action === 'accept' ? { completedAt: serverTimestamp() } : {})
          });
        }

        await addDoc(collection(db, 'threads', activeThreadId, 'messages'), {
          senderUid: currentUser.uid,
          type: 'system',
          text: action === 'accept' ? 'Delivery accepted.' : 'Revision requested.',
          createdAt: serverTimestamp()
        });

        toast(action === 'accept' ? 'Delivery accepted' : 'Revision requested', 'success');
      } catch (err) {
        console.error(err);
        toast('Could not update delivery', 'error');
        btn.disabled = false;
      }
    }

    // ==========================================
    // Compose
    // ==========================================
    const composer = $('composerInput');
    const sendBtn = $('sendBtn');

    composer.addEventListener('input', () => {
      sendBtn.disabled = !composer.value.trim();
      composer.style.height = 'auto';
      composer.style.height = Math.min(composer.scrollHeight, 120) + 'px';
    });
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendBtn.click();
      }
    });
    sendBtn.addEventListener('click', async () => {
      const text = composer.value.trim();
      if (!text || !activeThreadId) return;
      sendBtn.disabled = true;
      try {
        await addDoc(collection(db, 'threads', activeThreadId, 'messages'), {
          senderUid: currentUser.uid,
          type: 'text',
          text,
          createdAt: serverTimestamp()
        });
        await touchThread(text);
        composer.value = '';
        composer.style.height = 'auto';
      } catch (err) {
        console.error(err);
        toast('Could not send message', 'error');
      } finally {
        sendBtn.disabled = !composer.value.trim();
      }
    });

    async function touchThread(previewText) {
      const thread = threads.find(t => t.id === activeThreadId);
      if (!thread) return;
      const otherUid = (thread.participants || []).find(uid => uid !== currentUser.uid);
      await updateDoc(doc(db, 'threads', activeThreadId), {
        lastMessage: previewText.slice(0, 140),
        lastMessageAt: serverTimestamp(),
        [`unreadBy.${otherUid}`]: increment(1),
        [`unreadBy.${currentUser.uid}`]: 0
      });
    }

    // ==========================================
    // Misc UI
    // ==========================================
    $('convBackBtn').addEventListener('click', () => {
      $('threadsPane').classList.add('mobile-show');
      $('conversationPane').classList.add('mobile-hide');
      activeThreadId = null;
    });
    $('convProfileBtn').addEventListener('click', () => {
      const t = threads.find(t => t.id === activeThreadId);
      if (!t) return;
      const otherUid = (t.participants || []).find(uid => uid !== currentUser.uid);
      if (otherUid) window.open(`../../freelancer.html?id=${otherUid}`, '_blank');
    });
    $('convRefreshBtn').addEventListener('click', () => {
      if (activeThreadId) loadMessages(activeThreadId);
    });

    window.addEventListener('beforeunload', () => {
      unsubThreads?.();
      unsubMessages?.();
    });
  </script>
</body>
</html>
